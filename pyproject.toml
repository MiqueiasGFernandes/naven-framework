[project]
name = "naven"
version = "0.1.0"
description = "A production-first HTTP framework for Python"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
